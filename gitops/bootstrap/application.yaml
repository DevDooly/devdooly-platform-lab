apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-lab-home
  namespace: argocd
spec:
  project: platform-lab
  sources:
    - repoURL: https://github.com/DevDooly/devdooly-platform-lab.git
      targetRevision: bbc8c6eb0bfa9cc8871e538ae0f63027d81e9e53
      path: infra/charts/platform-lab
      helm:
        releaseName: lab
        valueFiles:
          - $values/gitops/environments/home-lab/values.yaml
    - repoURL: https://github.com/DevDooly/devdooly-platform-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-lab
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
    syncOptions:
      - PruneLast=true
