# Runtime settings are separate from the strict image-only values.yaml publication gate.
# API environment changes only when root coordinates the real rollout.
api:
  environment: mini-pc
# Root coordinates staged enablement after backup, migration and private bootstrap.
runtime:
  kafka:
    enabled: true
    existingSecret: platform-lab-kafka
  garage:
    enabled: true
    existingConfigSecret: platform-lab-garage-config
  worker:
    enabled: true
    image:
      repository: ghcr.io/devdooly/devdooly-platform-lab-api
      digest: sha256:209770d4a2ea0f9cab57f7a630ca097d45eb158efaae58f98768b1770fe7880f
    sourceCommit: 202ab6806130cfb37e8829ce7d52c89990d8a54a
    existingS3Secret: platform-lab-runtime-s3
