    enabled: true
    existingSecret: platform-lab-kafka
  garage:
    enabled: true
    existingConfigSecret: platform-lab-garage-config
  worker:
    enabled: true
    image:
      repository: ghcr.io/devdooly/devdooly-platform-lab-api
