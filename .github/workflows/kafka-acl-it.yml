name: Verify isolated Kafka DESCRIBE ACL manually

on:
  workflow_dispatch:
    inputs:
      confirm_kafka_acl:
        description: Run one fresh hosted Kafka DESCRIBE ACL test with owned cleanup
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kafka-acl-it
  cancel-in-progress: false

jobs:
  kafka-acl:
    if: github.repository == 'DevDooly/devdooly-platform-lab' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.confirm_kafka_acl == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      KAFKA_ACL_RUNTIME_OPT_IN: 'true'
    steps:
      - name: Checkout the exact requested main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check hosted identity and exact source
        timeout-minutes: 1
        run: |
          test "$GITHUB_REPOSITORY" = 'DevDooly/devdooly-platform-lab'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_ACTIONS" = 'true'
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          test "$RUNNER_OS" = 'Linux'
          test "$RUNNER_ARCH" = 'X64'
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Set up Java 21 without a shared Maven cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        timeout-minutes: 5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile isolated sources and prepare pinned dependencies without tests
        timeout-minutes: 16
        run: python3 -I -B infra/kafka-acl-ci/run_once.py prepare --source-manifest-sha256 d6689a47f77410ec057b210f54d37bc7aa281dafa4d4fc2b5cdfeb86caef6336 --ack-fresh-hosted-kafka-acl-it

      - name: Pull pinned images before resources and run one owned ACL test
        timeout-minutes: 18
        run: python3 -I -B infra/kafka-acl-ci/run_once.py run --source-manifest-sha256 d6689a47f77410ec057b210f54d37bc7aa281dafa4d4fc2b5cdfeb86caef6336 --ack-fresh-hosted-kafka-acl-it

      - name: Confirm owned cleanup even after failure
        if: always()
        timeout-minutes: 2
        run: python3 -I -B infra/kafka-acl-ci/run_once.py cleanup --source-manifest-sha256 d6689a47f77410ec057b210f54d37bc7aa281dafa4d4fc2b5cdfeb86caef6336 --ack-fresh-hosted-kafka-acl-it

      - name: Retain only the finite public summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: kafka-acl-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/kafka-acl-ci-public/summary.json
          if-no-files-found: error
          retention-days: 7
