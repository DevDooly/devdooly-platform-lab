name: Validate Lab containers

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - examples/**
      - apps/lab-web/**
      - tests/**
      - infra/containers/**
      - infra/maintenance/**
      - infra/spark-silver/**
      - infra/s3-ci/**
      - infra/iceberg-lab/**
      - infra/spark-ci/**
      - infra/cloud-lakehouse-ci/**
      - infra/iceberg-retention-ci/**
      - infra/image-lock.json
      - infra/scripts/prepare-local-env.py
      - infra/scripts/backup-lab.py
      - compose.yaml
      - .dockerignore
      - .github/workflows/lab-ci.yml
      - .github/workflows/publish-images.yml
      - .github/workflows/validate-gitops.yml
      - Jenkinsfile
      - infra/scripts/ci_publication_gate.py
      - infra/scripts/github-commit-status.mjs
      - infra/scripts/gitops_values.py
      - infra/scripts/propose_gitops_pr.py
      - infra/scripts/validate_gitops_pr.py
  workflow_dispatch:
    inputs:
      run_s3_trial:
        description: Run the separate isolated Apache5 MariaDB Garage trial
        required: false
        default: false
        type: boolean
      run_spark_trial:
        description: Run the separate isolated Spark JDBC Garage trial
        required: false
        default: false
        type: boolean
      run_cloud_lakehouse_trial:
        description: Run one fresh Cloud Spark to Trino compaction trial
        required: false
        default: false
        type: boolean
      run_iceberg_capture_trial:
        description: Run one fresh Cloud closed-copy capture without retention apply
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lab-containers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: lab-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: compose.yaml:.local/compose-ci.yaml
      COMPOSE_PARALLEL_LIMIT: '1'
      LAB_BASE_URL: http://127.0.0.1:4310
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate publication decisions without credentials
        run: python3 -m unittest discover -s tests/ci -p 'test_*.py' -v

      - name: Validate retention plans without credentials
        run: python3 -m unittest discover -s tests/maintenance -p 'test_*.py' -v

      - name: Validate SQLite backup lifecycle without services
        run: python3 -B -m unittest discover -s tests/operations -p 'test_*.py' -v

      - name: Validate Spark Silver proposal without Spark
        run: python3 -B -m unittest discover -s infra/spark-silver -p 'test_*.py' -v

      - name: Validate Iceberg plans without services
        run: python3 -B -m unittest discover -s infra/iceberg-lab/tests -p 'test_*.py' -v

      - name: Validate isolated Spark harness and public records without services
        run: python3 -B -m unittest discover -s infra/spark-ci -p 'test_*.py' -v

      - name: Validate isolated S3 harness without services
        run: python3 -B -m unittest discover -s infra/s3-ci -p 'test_*.py' -v

      - name: Validate fresh Cloud lakehouse boundaries without services
        run: python3 -B -m unittest discover -s infra/cloud-lakehouse-ci -p 'test_*.py' -v

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            apps/api/pom.xml
            examples/java-window-analysis/pom.xml

      - name: Verify API
        working-directory: apps/api
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

      - name: Verify Java example
        run: |
          chmod +x apps/api/mvnw
          ./apps/api/mvnw -B -ntp -f examples/java-window-analysis/pom.xml verify
          test -s examples/java-window-analysis/target/benchmarks.jar

      - name: Validate benchmark result handling without measuring performance
        run: python3 -B -m unittest discover -s examples/java-window-analysis/scripts -p 'test_*.py' -v

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/lab-web/package-lock.json

      - name: Validate status client without credentials
        run: node --test tests/ci/github-commit-status.test.mjs

      - name: Verify web
        working-directory: apps/lab-web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npm run build

      - name: Prepare isolated Compose environment
        run: |
          python3 infra/scripts/prepare-local-env.py
          node tests/integration/compose-ci.mjs prepare

      - name: Build container images
        run: docker compose --env-file .local/compose.env build --pull

      - name: Start MariaDB, API and web
        run: docker compose --env-file .local/compose.env up -d --wait --wait-timeout 180

      - name: Wait for API and persisted sample
        run: node tests/integration/compose-ci.mjs wait

      - name: Check actual same-origin UI and MariaDB results
        run: |
          node --experimental-strip-types apps/lab-web/scripts/smoke.ts http://127.0.0.1:4310/ http://127.0.0.1:4310/api
          node tests/integration/compose-ci.mjs check before

      - name: Recreate API with a new address
        run: node tests/integration/compose-ci.mjs recreate

      - name: Verify Nginx DNS refresh and persisted idempotency
        run: |
          node tests/integration/compose-ci.mjs wait
          node --experimental-strip-types apps/lab-web/scripts/smoke.ts http://127.0.0.1:4310/ http://127.0.0.1:4310/api
          node tests/integration/compose-ci.mjs check after

      - name: Show container state on failure
        if: failure()
        run: |
          if test -f .local/compose.env && test -f .local/compose-ci.yaml; then
            docker compose --env-file .local/compose.env ps --all
          fi

      - name: Stop Compose services
        if: always()
        run: |
          if test -f .local/compose.env && test -f .local/compose-ci.yaml; then
            docker compose --env-file .local/compose.env down --remove-orphans --timeout 20
          fi

      - name: Upload allowlisted validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-validation-${{ github.sha }}
          path: |
            apps/api/target/surefire-reports/TEST-*.xml
            examples/java-window-analysis/target/surefire-reports/TEST-*.xml
            examples/java-window-analysis/target/benchmarks.jar
            artifacts/compose-before.json
            artifacts/compose-after.json
          if-no-files-found: warn
          retention-days: 7

  isolated-spark:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_spark_trial == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout isolated Spark trial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate isolated harness boundaries
        run: python3 -B -m unittest discover -s infra/spark-ci -p 'test_*.py' -v
      - name: Run one isolated compatibility attempt
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 -B infra/spark-ci/run_ci.py
      - name: Upload public allowlist only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-spark-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/spark-ci-public/summary.json
          if-no-files-found: error
          retention-days: 7

  isolated-s3:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_s3_trial == true }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout isolated S3 trial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21 for existing integration tests
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Validate isolated S3 harness boundaries
        run: python3 -B -m unittest discover -s infra/s3-ci -p 'test_*.py' -v
      - name: Run one isolated real Garage attempt
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 -B infra/s3-ci/run_s3_ci.py
      - name: Upload safe S3 summary only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-s3-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/s3-ci-public/summary.json
          if-no-files-found: error
          retention-days: 7

  isolated-cloud-lakehouse:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_cloud_lakehouse_trial == true }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout fresh Cloud lakehouse trial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate fresh Cloud lakehouse boundaries without services
        run: python3 -B -m unittest discover -s infra/cloud-lakehouse-ci -p 'test_*.py' -v
      - name: Prepare pinned images and local build then run one 600-second workload
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        # The frozen driver downloads/validates JARs, pulls four pinned images,
        # and builds locally BEFORE its first PG/Garage start and single clock.
        # The 45-minute job bound includes preparation; workload stays 600s.
        run: >-
          python3 -B infra/cloud-lakehouse-ci/run_trial9.py
          --source-manifest-sha256 c63aded0a891bb66cb1fb2de591d67e237467681eb4a4e5a337b9d1d1b02d5e8
          --ack-fresh-cloud-trial9
      - name: Upload only the safe Cloud lakehouse summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-cloud-lakehouse-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/cloud-trial9-public/summary.json
          if-no-files-found: error
          retention-days: 7

  isolated-iceberg-capture:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_iceberg_capture_trial == true && inputs.run_spark_trial != true && inputs.run_s3_trial != true && inputs.run_cloud_lakehouse_trial != true }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout fresh closed-copy capture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up same-job Temurin Java 21 compiler
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pinned sources then all 80 Linux offline contracts
        # Base27 + archive24 + bounded7 + prep8 + CLI14; every literal source pin precedes test imports.
        # This root process writes only its tests' fresh temporary fixtures.
        run: |
          sudo -n env -i \
            PATH=/usr/bin:/bin LANG=C.UTF-8 \
            PLATFORM_LAB_SOURCE_ROOT="$GITHUB_WORKSPACE" \
            /usr/bin/python3 -I -B - <<'PY'
          """Inline source-pinned Linux offline workflow gate."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import stat
          import sys
          import unittest

          CLI_SHA = '7c84ff6b32114196293158f67cebbd91198e80fd349cbb1a32a3bfd856c93315'
          MANIFEST_SHA = 'c8a3d89458bca95a98547472816c5fb35f922aea934cd7da1a0cd4534c0c6fbf'
          EXPECTED_TESTS = 80
          TEST_SHAS = {
              'test_archive_classes.py': 'c627b15ff2275cee17114bc16ebaba5af80ede1d4995c20eafac135eda5a862d',
              'test_bounded_process.py': '83d160015798e18986c32bf3af6665373c52f3c0b8bcbaf881bd788b19434438',
              'test_composite.py': '2f7080816959573c845281d023e1a7346ced6626593806c1e0a52c5be7e6173c',
              'test_copy_loader.py': 'fb8ad9febef1d307244d57f4944d043985d1a756a4b5559a8e442fe752423196',
              'test_named_observer.py': '85ff4307d821dcb0c4ba8a8eb9ec4e4927ac158d887f3899df62ac9cdca8a477',
              'test_prep_decoder.py': '9cedbc3d9192773847a6b554be1db227632405d1b931623af324e83635c40a8b',
              'test_run_capture.py': '0c0fc8599611fd582ed68c94fa9c5573f2af3bb11b87b2e234a55275ebf774a8',
          }
          assert sys.platform == 'linux' and os.geteuid() == 0, 'ACTUAL_LINUX_ROOT_FIXTURES_REQUIRED'
          assert all(re.fullmatch('[a-f0-9]{64}', value) for value in (CLI_SHA, MANIFEST_SHA, *TEST_SHAS.values())), 'FINAL_LITERAL_SOURCE_PINS_REQUIRED'
          repo = Path(os.environ['PLATFORM_LAB_SOURCE_ROOT']).resolve(strict=True)
          folder = repo / 'infra/iceberg-retention-ci'
          cli_path = folder / 'run_capture.py'
          first = cli_path.lstat()
          assert stat.S_ISREG(first.st_mode) and first.st_nlink == 1 and 0 < first.st_size <= 262144, 'BOUNDED_REGULAR_CLI_SOURCE_REQUIRED'
          with os.fdopen(os.open(cli_path, os.O_RDONLY | os.O_NOFOLLOW), 'rb') as stream:
              opened = os.fstat(stream.fileno())
              raw = stream.read(262145)
              last = os.fstat(stream.fileno())
          after = cli_path.lstat()
          identity = lambda value: (value.st_dev, value.st_ino, value.st_mode, value.st_nlink, value.st_size, value.st_mtime_ns, value.st_ctime_ns)
          assert identity(first) == identity(opened) == identity(last) == identity(after) and len(raw) == first.st_size, 'STABLE_CLI_SOURCE_REQUIRED'
          assert hashlib.sha256(raw).hexdigest() == CLI_SHA, 'LITERAL_CLI_SOURCE_SHA_REQUIRED'
          # The pinned CLI has only stdlib imports and no import-time IO. Its definitions
          # verify all eleven runtime files, frozen seven/base eight, and five externals.
          gate = {'__name__': 'capture_source_gate_only', '__file__': str(cli_path)}
          exec(compile(raw, str(cli_path), 'exec'), gate)
          sources, originals = gate['reviewed_sources'](repo, MANIFEST_SHA)
          assert sources['run_capture.py'] == raw, 'SAME_VERIFIED_CLI_REQUIRED'
          assert {path.name for path in folder.glob('test_*.py')} == set(TEST_SHAS), 'EXACT_SEVEN_TEST_FILES_REQUIRED'
          for name, expected in TEST_SHAS.items():
              assert hashlib.sha256(gate['read'](folder / name)).hexdigest() == expected, 'LITERAL_TEST_SOURCE_SHA_REQUIRED'
          sys.path.insert(0, str(folder))
          suite = unittest.defaultTestLoader.discover(str(folder), pattern='test_*.py')
          assert suite.countTestCases() == EXPECTED_TESTS, 'EXACT_OFFLINE_TEST_DISCOVERY_COUNT_REQUIRED'
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == EXPECTED_TESTS and result.wasSuccessful() and not result.skipped, 'ALL_LINUX_CONTRACTS_WITH_ZERO_SKIPS_REQUIRED'
          assert gate['reviewed_sources'](repo, MANIFEST_SHA) == (sources, originals), 'RUNTIME_SOURCE_BYTES_UNCHANGED_AFTER_TESTS'
          for name, expected in TEST_SHAS.items():
              assert hashlib.sha256(gate['read'](folder / name)).hexdigest() == expected, 'TEST_SOURCE_BYTES_UNCHANGED_AFTER_TESTS'
          print(json.dumps({'scope': 'SOURCE_PINNED_LINUX_OFFLINE_CONTRACTS_ONLY',
              'testsRun': result.testsRun, 'failures': len(result.failures), 'errors': len(result.errors),
              'skips': len(result.skipped), 'effectiveUid': os.geteuid(), 'pythonVersion': platform.python_version(),
              'cliSourceSha256': CLI_SHA, 'runtimeManifestSha256': MANIFEST_SHA, 'testSourceSha256': TEST_SHAS,
              'sourceBytesUnchanged': True, 'actualRuntimeCalled': False}, sort_keys=True))
          PY
      - name: Prepare decoder then run one new fresh capture
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        # The explicit CLI prepares the compiler/classpath before original main.
        # Prep has a separate 600s bound; the frozen workload clock stays 600s.
        run: >-
          python3 -I -B infra/iceberg-retention-ci/run_capture.py
          --source-manifest-sha256 c8a3d89458bca95a98547472816c5fb35f922aea934cd7da1a0cd4534c0c6fbf
          --ack-fresh-closed-copy-capture
      - name: Upload only the new safe closed-copy summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iceberg-closed-copy-summary-${{ github.sha }}
          path: .local/iceberg-closed-copy-public/summary.json
          if-no-files-found: ignore
          retention-days: 7
