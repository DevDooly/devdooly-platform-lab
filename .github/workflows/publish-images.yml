name: Publish Lab images

on:
  workflow_run:
    workflows: [Validate Lab containers]
    types: [completed]
    branches: [main]
  status:
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: Successful Validate Lab containers run ID for the current main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lab-image-publication
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'status' && github.event.context == 'ci/jenkins-test' &&
       github.event.state == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
      commit: ${{ steps.eligibility.outputs.commit }}
    steps:
      - name: Checkout trusted gate from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Require both real CI paths on the exact current main SHA
        id: eligibility
        env:
          EXPECTED_JENKINS_ISSUER: ${{ vars.JENKINS_STATUS_ISSUER }}
        run: |
          python3 infra/scripts/ci_publication_gate.py \
            --event-file "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" \
            --repository "$GITHUB_REPOSITORY" --expected-issuer "$EXPECTED_JENKINS_ISSUER" \
            --output "$GITHUB_OUTPUT" --skip-if-published --publication-run-id "$GITHUB_RUN_ID"

  publish:
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      manifest: ${{ steps.deployment.outputs.manifest }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      DOCKER_BUILD_SUMMARY: 'false'
    steps:
      - name: Checkout the exact gated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false

      - name: Checkout trusted gate tools separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: .ci-tools
          persist-credentials: false

      - name: Recheck live gates before registry authentication
        id: source
        env:
          EXPECTED_JENKINS_ISSUER: ${{ vars.JENKINS_STATUS_ISSUER }}
          GATED_SOURCE_COMMIT: ${{ needs.gate.outputs.commit }}
        run: |
          python3 .ci-tools/infra/scripts/ci_publication_gate.py \
            --event-file "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" \
            --repository "$GITHUB_REPOSITORY" --expected-issuer "$EXPECTED_JENKINS_ISSUER" \
            --output "$GITHUB_OUTPUT" --require-eligible
          test "$(git rev-parse HEAD)" = "$GATED_SOURCE_COMMIT"
          printf 'tag=sha-%s-r%s-a%s\n' "$GATED_SOURCE_COMMIT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prebuild API without registry authentication or push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/containers/api.Dockerfile
          platforms: linux/amd64
          pull: true
          push: false
          outputs: type=cacheonly

      - name: Prebuild web without registry authentication or push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/containers/web.Dockerfile
          platforms: linux/amd64
          pull: true
          push: false
          outputs: type=cacheonly

      - name: Recheck current main and both CI paths immediately before publication
        env:
          EXPECTED_JENKINS_ISSUER: ${{ vars.JENKINS_STATUS_ISSUER }}
        run: |
          python3 .ci-tools/infra/scripts/ci_publication_gate.py \
            --event-file "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" \
            --repository "$GITHUB_REPOSITORY" --expected-issuer "$EXPECTED_JENKINS_ISSUER" \
            --output "$GITHUB_OUTPUT" --require-eligible

      - name: Log in to GHCR with the workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish prebuilt API from the same builder cache
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/containers/api.Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.source.outputs.api_image }}:${{ steps.source.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.title=DevDooly Platform Lab API
          provenance: mode=min

      - name: Publish prebuilt web from the same builder cache
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/containers/web.Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.source.outputs.web_image }}:${{ steps.source.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.title=DevDooly Platform Lab web
          provenance: mode=min

      - name: Verify registry digests and write deployment inputs
        id: deployment
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          VALIDATION_RUN_ID: ${{ steps.source.outputs.validation_run_id }}
          JENKINS_STATUS_ID: ${{ steps.source.outputs.jenkins_status_id }}
          JENKINS_BUILD_NUMBER: ${{ steps.source.outputs.jenkins_build_number }}
          JENKINS_ISSUER: ${{ steps.source.outputs.jenkins_issuer }}
          IMAGE_TAG: ${{ steps.source.outputs.tag }}
          API_IMAGE: ${{ steps.source.outputs.api_image }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_IMAGE: ${{ steps.source.outputs.web_image }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib, re, subprocess

          images = {}
          for component in ('api', 'web'):
              repository = os.environ[f'{component.upper()}_IMAGE']
              digest = os.environ[f'{component.upper()}_DIGEST']
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                  raise SystemExit(f'{component}: no valid digest was returned by the publication step.')
              reference = f'{repository}@{digest}'
              result = subprocess.run([
                  'docker', 'buildx', 'imagetools', 'inspect', reference,
                  '--format', '{{json .Manifest}}',
              ], check=True, capture_output=True, text=True, timeout=90)
              manifest = json.loads(result.stdout)
              if manifest.get('digest') != digest:
                  raise SystemExit(f'{component}: the registry digest differs from the publication output.')
              images[component] = {
                  'repository': repository, 'tag': os.environ['IMAGE_TAG'],
                  'digest': digest, 'reference': reference, 'platform': 'linux/amd64',
              }
          document = {
              'schemaVersion': 1,
              'sourceCommit': os.environ['SOURCE_COMMIT'],
              'validationRunId': int(os.environ['VALIDATION_RUN_ID']),
              'jenkins': {
                  'context': 'ci/jenkins-test',
                  'statusId': int(os.environ['JENKINS_STATUS_ID']),
                  'buildNumber': int(os.environ['JENKINS_BUILD_NUMBER']),
                  'issuer': os.environ['JENKINS_ISSUER'],
              },
              'publicationRunUrl': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'observedAt': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
              'images': images,
              'deploymentStatus': 'NOT_DEPLOYED_BY_THIS_WORKFLOW',
              'anonymousPullStatus': 'NOT_CHECKED',
          }
          output = pathlib.Path('artifacts/publication')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'image-manifest.json').write_text(json.dumps(document, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write('manifest=' + json.dumps(document, separators=(',', ':')) + '\n')
          values = (
              '# Published image inputs only. Supply database.existingSecret separately.\n'
              'api:\n  image:\n'
              f"    repository: {images['api']['repository']}\n    digest: {images['api']['digest']}\n"
              f"  sourceCommit: {os.environ['SOURCE_COMMIT']}\n"
              'web:\n  image:\n'
              f"    repository: {images['web']['repository']}\n    digest: {images['web']['digest']}\n"
          )
          (output / 'helm-image-values.yaml').write_text(values, encoding='utf-8')
          summary = (
              f"Validated source: `{document['sourceCommit']}`\n\n"
              f"Validation run: {document['validationRunId']}\n\n"
              + '\n'.join(f"- {name}: `{item['reference']}`" for name, item in images.items())
              + '\n\nPublication verified. Deployment and anonymous pull have not been checked.\n'
          )
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write(summary)
          PY

      - name: Upload published image references
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-images-${{ steps.source.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/publication/image-manifest.json
            artifacts/publication/helm-image-values.yaml
          if-no-files-found: error
          retention-days: 14


  propose-gitops:
    needs: [gate, publish]
    if: needs.publish.result == 'success' && vars.LAB_GITOPS_PR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted proposal tools from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Recheck publication evidence and propose an image-only draft PR
        env:
          PUBLISHED_MANIFEST: ${{ needs.publish.outputs.manifest }}
          EXPECTED_JENKINS_ISSUER: ${{ vars.JENKINS_STATUS_ISSUER }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          document = json.loads(os.environ['PUBLISHED_MANIFEST'])
          destination = pathlib.Path('artifacts/publication/image-manifest.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(document), encoding='utf-8')
          PY
          python3 infra/scripts/propose_gitops_pr.py \
            --manifest artifacts/publication/image-manifest.json \
            --expected-issuer "$EXPECTED_JENKINS_ISSUER"
