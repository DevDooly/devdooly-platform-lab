name: Verify public HTTPS reads manually

on:
  pull_request:
    paths:
      - .github/workflows/public-https-smoke.yml
      - infra/public-https-smoke/**
      - apps/lab-web/src/lib/public-api-base.ts
      - apps/lab-web/src/lib/api.ts
      - apps/lab-web/src/lib/observation.ts
      - apps/lab-web/src/lib/job-observation.ts
      - apps/lab-web/src/lib/kafka-observation.ts
      - apps/lab-web/src/data/snapshot.json
  push:
    branches: [main]
    paths:
      - .github/workflows/public-https-smoke.yml
      - infra/public-https-smoke/**
      - apps/lab-web/src/lib/public-api-base.ts
      - apps/lab-web/src/lib/api.ts
      - apps/lab-web/src/lib/observation.ts
      - apps/lab-web/src/lib/job-observation.ts
      - apps/lab-web/src/lib/kafka-observation.ts
      - apps/lab-web/src/data/snapshot.json
  workflow_dispatch:
    inputs:
      confirm_smoke:
        description: Run one bounded off-LAN HTTPS read verification
        required: true
        type: boolean
        default: false
      confirm_route_ownership:
        description: Lab route ownership and denied paths are verified, including POST isolation
        required: true
        type: boolean
        default: false
      use_candidate_endpoint:
        description: Verify a dedicated candidate secret without changing live Pages configuration
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-https-smoke
  cancel-in-progress: false

jobs:
  offline:
    if: github.repository == 'DevDooly/devdooly-platform-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
      - name: Verify synthetic transport boundaries without external requests
        run: |
          env -u NODE_OPTIONS -u NODE_EXTRA_CA_CERTS -u NODE_TLS_REJECT_UNAUTHORIZED \
            -u NODE_DEBUG -u NODE_DEBUG_NATIVE -u SSL_CERT_FILE -u SSL_CERT_DIR -u SSLKEYLOGFILE \
            -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u NO_PROXY \
            -u http_proxy -u https_proxy -u all_proxy -u no_proxy -u NODE_USE_ENV_PROXY \
            timeout 60s node --experimental-test-module-mocks --experimental-strip-types \
            --test infra/public-https-smoke/smoke.test.mjs
  smoke:
    needs: offline
    if: github.repository == 'DevDooly/devdooly-platform-lab' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_smoke == true && inputs.confirm_route_ownership == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
      - name: Read the owned public HTTPS API once
        if: inputs.use_candidate_endpoint != true
        env:
          # Secret mirror prevents the runner's env display from exposing the vars value.
          LAB_PUBLIC_API_URL: ${{ secrets.LAB_PUBLIC_API_URL }}
          SMOKE_VARIABLE_MATCH: ${{ vars.LAB_PUBLIC_API_URL != '' && vars.LAB_PUBLIC_API_URL == secrets.LAB_PUBLIC_API_URL }}
          SMOKE_CONFIRM: ${{ inputs.confirm_smoke }}
          SMOKE_ROUTE_OWNERSHIP: ${{ inputs.confirm_route_ownership }}
        run: |
          env -u NODE_OPTIONS -u NODE_EXTRA_CA_CERTS -u NODE_TLS_REJECT_UNAUTHORIZED \
            -u NODE_DEBUG -u NODE_DEBUG_NATIVE -u SSL_CERT_FILE -u SSL_CERT_DIR -u SSLKEYLOGFILE \
            -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u NO_PROXY \
            -u http_proxy -u https_proxy -u all_proxy -u no_proxy -u NODE_USE_ENV_PROXY \
            timeout 160s node --experimental-strip-types infra/public-https-smoke/smoke.ts \
            "$RUNNER_TEMP/public-https-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
      - name: Read the owned candidate HTTPS API once
        if: inputs.use_candidate_endpoint == true
        env:
          # Secret-only candidate URL is masked; no live variable is read.
          LAB_PUBLIC_API_URL: ${{ secrets.LAB_PUBLIC_API_CANDIDATE_URL }}
          SMOKE_VARIABLE_MATCH: ${{ secrets.LAB_PUBLIC_API_CANDIDATE_URL != '' }}
          SMOKE_CONFIRM: ${{ inputs.confirm_smoke }}
          SMOKE_ROUTE_OWNERSHIP: ${{ inputs.confirm_route_ownership }}
        run: |
          env -u NODE_OPTIONS -u NODE_EXTRA_CA_CERTS -u NODE_TLS_REJECT_UNAUTHORIZED \
            -u NODE_DEBUG -u NODE_DEBUG_NATIVE -u SSL_CERT_FILE -u SSL_CERT_DIR -u SSLKEYLOGFILE \
            -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u NO_PROXY \
            -u http_proxy -u https_proxy -u all_proxy -u no_proxy -u NODE_USE_ENV_PROXY \
            timeout 160s node --experimental-strip-types infra/public-https-smoke/smoke.ts \
            "$RUNNER_TEMP/public-https-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
      - name: Retain finite validation result only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-https-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-https-smoke-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 7
