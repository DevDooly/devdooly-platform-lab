name: Publish portfolio
run-name: Portfolio snapshots v3 · ${{ github.event_name }}

on:
  push:
    branches: [main]
    paths:
      - apps/lab-web/**
      - tests/scenarios/sensor-validation-v1.json
      - tests/observation/**
      - infra/scripts/prepare-pages-observation.py
      - infra/observation/**
      - .github/workflows/pages.yml
  workflow_dispatch:
    inputs:
      platform_snapshot:
        description: 검증할 플랫폼 관측 JSON (최대 16KiB, 생략 시 이전 기록 유지)
        required: false
        type: string
      jobs_snapshot:
        description: 실제 배포 작업 관측 JSON (최대 32KiB, 생략 시 이전 기록 유지)
        required: false
        type: string
      kafka_snapshot:
        description: 실제 배포 Kafka 관측 JSON (최대 8KiB, 생략 시 이전 기록 유지)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: apps/lab-web
    env:
      SITE_URL: https://devdooly.github.io
      SITE_BASE: /devdooly-platform-lab/
      PUBLIC_API_BASE_URL: ${{ vars.LAB_PUBLIC_API_URL || '/api' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/lab-web/package-lock.json
      - run: npm ci
      - name: Verify observation publication policy
        working-directory: .
        run: python3 -m unittest discover -s tests/observation -p 'test_*.py' -v
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Preserve and merge validated platform observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 ../../infra/scripts/prepare-pages-observation.py
          --repository "$GITHUB_WORKSPACE"
          --output-directory dist/data
          --seed-file public/data/platform-observation.json
          --job-output-directory dist/observations
          --job-artifact-directory "$RUNNER_TEMP/job-observation-publication"
          --job-seed-file public/observations/jobs.latest.json
          --kafka-output-directory dist/observations
          --kafka-artifact-directory "$RUNNER_TEMP/kafka-observation-publication"
      - name: Retain the exact published observation per attempt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-observation-${{ github.run_id }}-a${{ github.run_attempt }}
          path: apps/lab-web/dist/data/platform-observation.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain exact job publication presence and record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: job-observation-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/job-observation-publication
          if-no-files-found: error
          retention-days: 90
      - name: Retain exact Kafka publication presence and record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kafka-observation-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/kafka-observation-publication
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/lab-web/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
