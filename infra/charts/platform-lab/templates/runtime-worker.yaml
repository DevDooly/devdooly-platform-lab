{{- if .Values.runtime.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-lab.fullname" . }}-worker
  labels:
    {{- include "platform-lab.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.runtime.worker.replicaCount }}
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "platform-lab.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "platform-lab.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        platform-lab.devdooly.dev/source-commit: {{ .Values.runtime.worker.sourceCommit | quote }}
    spec:
      serviceAccountName: {{ include "platform-lab.fullname" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.runtime.worker.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: {{ include "platform-lab.image" .Values.runtime.worker.image | quote }}
          imagePullPolicy: IfNotPresent
          args: ["--lab-runtime=run"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Progress records come only from this PID 1 owner after journal commits.
          # No listener, Service, background heartbeat, public execution or liveness restart.
          {{- if .Values.runtime.worker.progressProbeEnabled }}
          readinessProbe:
            exec:
              command: ["java", "-Xms8m", "-Xmx16m", "-XX:MaxMetaspaceSize=24m", "-XX:ReservedCodeCacheSize=16m", "-XX:+UseSerialGC", "-XX:ActiveProcessorCount=1", "-cp", "/app/runtime-probe", "io.github.devdooly.platformlab.jobs.runtime.health.RuntimeReadyProbe"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          {{- end }}
          env:
            {{- if .Values.runtime.worker.progressProbeEnabled }}
            - {name: LAB_RUNTIME_PROGRESS_FILE, value: /tmp/lab-runtime/ready}
            - name: LAB_RUNTIME_POD_UID
              valueFrom:
                fieldRef: {apiVersion: v1, fieldPath: metadata.uid}
            {{- end }}
            - name: DB_URL
              value: {{ printf "jdbc:mariadb://db.%s.svc.cluster.local:3306/platform_lab" .Release.Namespace | quote }}
            - {name: DB_USERNAME, value: platform_lab}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.appPasswordKey | quote }}
            - name: LAB_ENVIRONMENT
              value: {{ .Values.runtime.worker.environment | quote }}
            - name: SOURCE_COMMIT
              value: {{ .Values.runtime.worker.sourceCommit | quote }}
            - name: IMAGE_DIGEST
              value: {{ .Values.runtime.worker.image.digest | quote }}
            - name: LAB_RUNTIME_KAFKA_BOOTSTRAP
              value: {{ printf "kafka.%s.svc.cluster.local:9092" .Release.Namespace | quote }}
            - name: LAB_RUNTIME_KAFKA_TOPIC
              value: {{ .Values.runtime.worker.topic | quote }}
            - name: LAB_RUNTIME_KAFKA_GROUP
              value: {{ .Values.runtime.worker.group | quote }}
            - name: LAB_RUNTIME_S3_ENDPOINT
              value: {{ printf "http://garage.%s.svc.cluster.local:3900" .Release.Namespace | quote }}
            - name: LAB_RUNTIME_S3_REGION
              value: {{ .Values.runtime.worker.region | quote }}
            - name: LAB_RUNTIME_S3_BUCKET
              value: {{ .Values.runtime.worker.bucket | quote }}
            - name: LAB_RUNTIME_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "runtime.worker.existingS3Secret must name a pre-created Secret" .Values.runtime.worker.existingS3Secret | quote }}
                  key: {{ .Values.runtime.worker.accessKeyIdKey | quote }}
            - name: LAB_RUNTIME_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtime.worker.existingS3Secret | quote }}
                  key: {{ .Values.runtime.worker.secretAccessKeyKey | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.timezone=Asia/Seoul -XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError"
          resources:
            {{- toYaml .Values.runtime.worker.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 100Mi}
{{- end }}
