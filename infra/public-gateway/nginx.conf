# Prototype only: no TLS listener, Ingress, NodePort, tunnel or production rollout.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 128; }

http {
  default_type application/json;
  log_format gateway_counts 'public-gateway $status $limit_req_status $limit_conn_status';
  access_log /dev/stdout gateway_counts;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  client_header_timeout 5s;
  client_body_timeout 5s;
  send_timeout 5s;
  keepalive_timeout 5s;
  keepalive_requests 20;
  client_header_buffer_size 1k;
  large_client_header_buffers 2 4k;
  # Zero means unlimited, NOT zero bytes. Entity headers are checked below.
  client_max_body_size 1k;

  upstream public_api {
    # Fixed Service name. No request header, URI, query or variable selects a host.
    server api.platform-lab.svc.cluster.local:8080;
  }
  map $request_uri $canonical_public_path {
    default 0;
    "~^/api/platform/summary$" 1;
    "~^/api/platform/releases$" 1;
    "~^/api/demo/runs$" 1;
    "~^/api/jobs/observation$" 1;
    "~^/api/kafka/observation$" 1;
    "~^/api/demo/runs/[a-z0-9][a-z0-9._-]{0,79}$" 1;
  }
  map $request_method $allowed_methods {
    default GET;
    "~^GET$" "";
  }
  map $http_origin $cors_origin {
    default "";
    "~^https://devdooly[.]github[.]io$" https://devdooly.github.io;
  }
  map $http_origin $origin_rejected {
    default 1;
    "" 0;
    "~^https://devdooly[.]github[.]io$" 0;
  }
  map $http_content_length $entity_rejected {
    default 1;
    "" 0;
    "0" 0;
  }
  limit_req_zone $binary_remote_addr zone=read_peer:1m rate=2r/s;
  limit_req_zone $server_name zone=read_total:1m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=kafka_peer:1m rate=30r/m;
  limit_conn_zone $binary_remote_addr zone=connections_peer:1m;
  limit_conn_zone $server_name zone=connections_total:1m;

  server {
    # HTTP/1 only. HTTPS termination and trusted peer handling are undecided.
    listen 8080 default_server;
    server_name public-read-gateway;
    add_header Allow $allowed_methods always;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # limit_except GET would also allow HEAD; test the actual method instead.
    if ($request_method != GET) { return 405; }
    # $request_uri retains encoding, duplicate slashes, dot segments and '?'.
    if ($canonical_public_path = 0) { return 404; }
    if ($origin_rejected = 1) { return 403; }
    if ($http_authorization != "") { return 400 '{"kind":"public-gateway-error","code":"INVALID_REQUEST"}'; }
    if ($http_cookie != "") { return 400 '{"kind":"public-gateway-error","code":"INVALID_REQUEST"}'; }
    if ($entity_rejected = 1) { return 400 '{"kind":"public-gateway-error","code":"INVALID_REQUEST"}'; }
    if ($http_transfer_encoding != "") { return 400 '{"kind":"public-gateway-error","code":"INVALID_REQUEST"}'; }
    if ($http_content_type != "") { return 400 '{"kind":"public-gateway-error","code":"INVALID_REQUEST"}'; }
    if ($http_expect != "") { return 400 '{"kind":"public-gateway-error","code":"INVALID_REQUEST"}'; }

    error_page 403 = @forbidden;
    error_page 404 = @not_found;
    error_page 405 = @method_not_allowed;
    error_page 429 = @limited;
    error_page 301 302 303 307 308 500 502 503 504 = @unavailable;

    location = /api/platform/summary { include /etc/public-gateway/proxy.inc; proxy_pass http://public_api; }
    location = /api/platform/releases { include /etc/public-gateway/proxy.inc; proxy_pass http://public_api; }
    location = /api/demo/runs { include /etc/public-gateway/proxy.inc; proxy_pass http://public_api; }
    location = /api/jobs/observation { include /etc/public-gateway/proxy.inc; proxy_pass http://public_api; }
    location = /api/kafka/observation {
      include /etc/public-gateway/proxy.inc;
      # Include carries both general limits at this level; inheritance is not assumed.
      limit_req zone=kafka_peer burst=1 nodelay;
      proxy_pass http://public_api;
    }
    location ~ "^/api/demo/runs/[a-z0-9][a-z0-9._-]{0,79}$" {
      include /etc/public-gateway/proxy.inc;
      proxy_pass http://public_api;
    }
    location / { return 404; }
    location @forbidden { return 403 '{"kind":"public-gateway-error","code":"ORIGIN_REJECTED"}'; }
    location @not_found { return 404 '{"kind":"public-gateway-error","code":"NOT_FOUND"}'; }
    location @method_not_allowed { return 405 '{"kind":"public-gateway-error","code":"GET_REQUIRED"}'; }
    location @limited { return 429 '{"kind":"public-gateway-error","code":"READ_LIMITED"}'; }
    location @unavailable { return 503 '{"kind":"public-gateway-error","code":"READ_UNAVAILABLE"}'; }
  }
}
