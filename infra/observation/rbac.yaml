apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-public-observer
  namespace: platform-lab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-public-observer
  namespace: platform-lab
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [services]
    resourceNames: [api, web, db]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [lab-platform-lab-api, lab-platform-lab-web]
    verbs: [get]
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [lab-platform-lab-db]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-public-observer
  namespace: platform-lab
subjects:
  - kind: ServiceAccount
    name: platform-public-observer
    namespace: platform-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-public-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-public-observer
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [platform-lab-home]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-public-observer
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: platform-public-observer
    namespace: platform-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-public-observer
