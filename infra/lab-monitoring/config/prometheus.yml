global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/platform-monitoring/workload-rules.yml
scrape_configs:
  - job_name: kube-state-metrics
    scrape_timeout: 5s
    static_configs:
      - targets: ["kube-state-metrics:8080"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'kube_(deployment_spec_replicas|statefulset_replicas|(deployment|statefulset)_status_replicas_ready)'
        action: keep
