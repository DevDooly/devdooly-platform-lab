apiVersion: 1
datasources:
  - name: Lab Prometheus
    type: prometheus
    uid: platform-lab-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Lab Loki
    type: loki
    uid: platform-lab-loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 500
    editable: false
