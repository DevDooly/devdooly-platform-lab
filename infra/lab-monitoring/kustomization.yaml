apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-lab-monitoring

resources:
  - workloads.yaml
  - network-policy.yaml

configMapGenerator:
  - name: prometheus-config
    files:
      - config/prometheus.yml
      - config/workload-rules.yml
  - name: loki-config
    files:
      - config/loki.yml
  - name: alloy-config
    files:
      - config/config.alloy
  - name: grafana-datasources
    files:
      - config/datasources.yml
  - name: grafana-dashboard-provider
    files:
      - config/dashboard-provider.yml
  - name: grafana-dashboard
    files:
      - config/services.json
