apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-lab-monitoring-workload-state
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-lab-monitoring-workload-state
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: platform-lab-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-lab-monitoring-workload-state
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-lab-monitoring-pod-logs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-lab-monitoring-pod-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: platform-lab-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-lab-monitoring-pod-logs
