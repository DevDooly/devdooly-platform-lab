apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-backends-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-from-grafana
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: grafana}
      ports:
        - {port: 9090, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-from-grafana-and-alloy
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: loki}
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [grafana, alloy]}
      ports:
        - {port: 3100, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics-from-prometheus
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: kube-state-metrics}
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports:
        - {port: 8080, protocol: TCP}
