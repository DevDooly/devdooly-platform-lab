apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
          ports:
            - {name: http, containerPort: 3000}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 96Mi, ephemeral-storage: 32Mi}
            limits: {cpu: 500m, memory: 256Mi, ephemeral-storage: 256Mi}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 15
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: grafana-admin, key: admin-password}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_SERVER_ROUTER_LOGGING, value: "true"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: dashboard-json, mountPath: /etc/grafana/platform-dashboards, readOnly: true}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 128Mi}
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: dashboard-provider
          configMap: {name: grafana-dashboard-provider}
        - name: dashboard-json
          configMap: {name: grafana-dashboard}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: prometheus}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
          args:
            - --config.file=/etc/platform-monitoring/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=48h
            - --storage.tsdb.retention.size=300MB
            - --query.max-concurrency=4
          ports:
            - {name: http, containerPort: 9090}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi, ephemeral-storage: 128Mi}
            limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 768Mi}
          startupProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 15
          volumeMounts:
            - {name: data, mountPath: /prometheus}
            - {name: config, mountPath: /etc/platform-monitoring, readOnly: true}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 512Mi}
        - name: config
          configMap: {name: prometheus-config}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: loki}
  template:
    metadata:
      labels: {app.kubernetes.io/name: loki}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: loki
          image: docker.io/grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
          args: ["-config.file=/etc/platform-monitoring/loki.yml"]
          ports:
            - {name: http, containerPort: 3100}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 75m, memory: 128Mi, ephemeral-storage: 256Mi}
            limits: {cpu: 750m, memory: 512Mi, ephemeral-storage: 1536Mi}
          startupProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 15
          volumeMounts:
            - {name: data, mountPath: /var/lib/loki}
            - {name: config, mountPath: /etc/platform-monitoring, readOnly: true}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 1Gi}
        - name: config
          configMap: {name: loki-config}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: alloy}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alloy}
    spec:
      serviceAccountName: alloy
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: alloy
          image: docker.io/grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --server.http.enable-pprof=false
            - --server.http.disable-support-bundle=true
            - --disable-reporting
            - --storage.path=/var/lib/alloy/data
            - /etc/platform-monitoring/config.alloy
          ports:
            - {name: http, containerPort: 12345}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 64Mi, ephemeral-storage: 32Mi}
            limits: {cpu: 500m, memory: 256Mi, ephemeral-storage: 256Mi}
          startupProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 15
          volumeMounts:
            - {name: data, mountPath: /var/lib/alloy/data}
            - {name: config, mountPath: /etc/platform-monitoring, readOnly: true}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 128Mi}
        - name: config
          configMap: {name: alloy-config}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: kube-state-metrics}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kube-state-metrics}
    spec:
      serviceAccountName: kube-state-metrics
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
          args:
            - --resources=deployments,statefulsets
            - --namespaces=platform-lab,jenkins,argocd,platform-lab-monitoring
          ports:
            - {name: http, containerPort: 8080}
            - {name: telemetry, containerPort: 8081}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 25m, memory: 48Mi, ephemeral-storage: 16Mi}
            limits: {cpu: 250m, memory: 128Mi, ephemeral-storage: 128Mi}
          startupProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /readyz, port: telemetry}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - {name: http, port: 3000, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - {name: http, port: 9090, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loki
  ports:
    - {name: http, port: 3100, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - {name: http, port: 8080, targetPort: http}
