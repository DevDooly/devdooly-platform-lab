apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-lab-kafbat
  namespace: platform-lab
  labels:
    app.kubernetes.io/name: kafbat-ui
    app.kubernetes.io/instance: platform-lab-kafbat
    app.kubernetes.io/part-of: platform-lab-service-console
data:
  application.yaml: |
    server:
      port: 8080
      error:
        include-stacktrace: never
    auth:
      # External HTTPS authentication must be enforced by the operator's proxy.
      type: DISABLED
    dynamic:
      config:
        enabled: false
    mcp:
      enabled: false
    springdoc:
      api-docs:
        enabled: false
      swagger-ui:
        enabled: false
    github:
      release:
        info:
          enabled: false
    kafka:
      admin-client-timeout: 10000
      clusters:
        - name: platform-lab
          bootstrap-servers: kafka.platform-lab.svc.cluster.local:9092
          read-only: true
          default-key-serde: String
          default-value-serde: String
          consumer-properties:
            allow.auto.create.topics: false
            enable.auto.commit: false
            max.poll.records: 100
          audit:
            topic-audit-enabled: false
            console-audit-enabled: false
      polling:
        poll-timeout-ms: 1000
        default-page-size: 50
        max-page-size: 100
    management:
      endpoints:
        web:
          exposure:
            include: health
      endpoint:
        health:
          show-details: never
          probes:
            enabled: true
    logging:
      level:
        root: INFO
        io.kafbat.ui: INFO
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-lab-kafbat
  namespace: platform-lab
  labels:
    app.kubernetes.io/name: kafbat-ui
    app.kubernetes.io/instance: platform-lab-kafbat
    app.kubernetes.io/part-of: platform-lab-service-console
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kafbat-ui
      app.kubernetes.io/instance: platform-lab-kafbat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafbat-ui
        app.kubernetes.io/instance: platform-lab-kafbat
        app.kubernetes.io/part-of: platform-lab-service-console
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: kafbat-ui
          # v1.5.0 OCI index; checked against the registry body SHA256.
          image: ghcr.io/kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/etc/kafbat/application.yaml
            - name: JAVA_OPTS
              value: -Xms64m -Xmx384m -XX:+ExitOnOutOfMemoryError -Djava.io.tmpdir=/tmp
            - name: DYNAMIC_CONFIG_ENABLED
              value: "false"
            - name: SWAGGER_UI_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 500m
              memory: 768Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/kafbat
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: platform-lab-kafbat
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: platform-lab-kafbat
  namespace: platform-lab
  labels:
    app.kubernetes.io/name: kafbat-ui
    app.kubernetes.io/instance: platform-lab-kafbat
    app.kubernetes.io/part-of: platform-lab-service-console
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafbat-ui
    app.kubernetes.io/instance: platform-lab-kafbat
  ports:
    - name: http
      port: 8080
      targetPort: http
