# argo/argo-cd 10.10.2 전용. 기본 TLS와 로컬 계정 인증을 유지한다.
global:
  domain: localhost
configs:
  cm:
    url: https://localhost:8443
    admin.enabled: true
    users.anonymous.enabled: false
    exec.enabled: false
  params:
    server.insecure: false
server:
  replicas: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false
  ingressGrpc:
    enabled: false
  resources:
    requests: {cpu: "50m", memory: "96Mi"}
    limits: {cpu: "500m", memory: "256Mi"}
controller:
  replicas: 1
  resources:
    requests: {cpu: "100m", memory: "256Mi"}
    limits: {cpu: "1000m", memory: "512Mi"}
repoServer:
  replicas: 1
  resources:
    requests: {cpu: "100m", memory: "128Mi"}
    limits: {cpu: "1000m", memory: "512Mi"}
redis:
  enabled: true
  resources:
    requests: {cpu: "50m", memory: "64Mi"}
    limits: {cpu: "250m", memory: "128Mi"}
redisSecretInit:
  resources:
    requests: {cpu: "100m", memory: "64Mi"}
    limits: {cpu: "200m", memory: "128Mi"}
redis-ha:
  enabled: false
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0