spring:
  application:
    name: devdooly-platform-lab-api
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3306/platform_lab}
    username: ${DB_USERNAME:platform_lab}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
lab:
  environment: ${LAB_ENVIRONMENT:local}
  source-commit: ${SOURCE_COMMIT:unknown}
  image-digest: ${IMAGE_DIGEST:}
  database-label: MariaDB
  kafka-observation:
    enabled: ${LAB_KAFKA_OBSERVATION_ENABLED:false}
    bootstrap: ${LAB_KAFKA_OBSERVATION_BOOTSTRAP:}
    topic: ${LAB_KAFKA_OBSERVATION_TOPIC:}
    group: ${LAB_KAFKA_OBSERVATION_GROUP:}
    expected-cluster-id: ${LAB_KAFKA_OBSERVATION_EXPECTED_CLUSTER_ID:}
